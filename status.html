<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الحساب والتحكم بالسرعة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(269deg, #08a3e4, #014c78, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        .status-card h2 { margin-bottom: 20px; color: #00c6ff; font-size: 1.5rem; }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .detail-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgb(0 255 197);
        }
        .remain-box {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(255, 198, 0, 0.2), rgba(255, 141, 0, 0.2));
            border: 1px solid rgba(255, 198, 0, 0.4);
        }
        .speed-control-box {
            grid-column: span 2;
            background: rgba(0, 198, 255, 0.1);
            border: 1px solid rgba(0, 198, 255, 0.3);
            padding: 15px;
            border-radius: 12px;
            text-align: right;
        }
        .detail-title {font-size: 14px; color: rgb(0 255 252); margin-bottom: 5px;}
        .detail-value { font-size: 14px; font-weight: bold; color: #fff; }
        .remain-box .detail-value { color: #ffc600; font-size: 1.3rem; }
        
        .speed-select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
            background: #203a43;
            color: #fff;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }
        .speed-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(to right, #0072ff, #00c6ff);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .speed-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,198,255,0.3); }

        .logout-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div class="status-card">
        <h2>تفاصيل الحساب والتحكم بالسرعة</h2>
        
        <div class="details-grid">
            <div class="detail-box">
                <div class="detail-title">اسم المستخدم</div>
                <div class="detail-value" id="masked-user">جاري التحميل...</div>
            </div>
            <div class="detail-box">
                <div class="detail-title">حالة حسابك</div>
                <div class="detail-value" style="color: #00ff87;">نشط</div>
            </div>
            
            <div class="detail-box remain-box">
                <div class="detail-title">التحميل المتبقي (الرصيد)</div>
                <div class="detail-value" id="remain-bytes">جاري الحساب...</div>
            </div>

            <div class="detail-box">
                <div class="detail-title">حجم التحميل (Download)</div>
                <div class="detail-value" style="color: #00c6ff;">$(bytes-out-nice)</div>
            </div>
            <div class="detail-box">
                <div class="detail-title">حجم الرفع (Upload)</div>
                <div class="detail-value" style="color: #ff9f43;">$(bytes-in-nice)</div>
            </div>

            <div class="detail-box">
                <div class="detail-title">الوقت المستهلك (Uptime)</div>
                <div class="detail-value">$(uptime)</div>
            </div>
            <div class="detail-box">
                <div class="detail-title">الوقت المتبقي</div>
                <div class="detail-value">$(session-time-left)</div>
            </div>

      <!-- نموذج تغيير السرعة المطور لحل مشكلة التوجيه الخارجي -->
<div class="speed-control-box">
    <div class="detail-title" style="color: #00c6ff; font-weight: bold;">تعديل سرعة الإنترنت فوراً:</div>
    
    <form id="speed-change-form">
        <input type="hidden" name="erase-cookie" value="true">
        
        <select name="dst" id="speed-select" class="speed-select" required>
            <option value="" disabled selected>اختر السرعة المطلوبة...</option>
            <option value="4a4b4c4d4e4f4g-44f">سرعة اقتصادية </option>
            <option value="9a9b9c9d9e9f9-99-ba">سرعة فائقة</option>
            <option value="8a8b8c8d8e8f8g8h8i-55-sa">السرعة القصوى </option>
        </select>
        <button type="submit" class="speed-btn">تحديث السرعة وإعادة الاتصال</button>
    </form>
</div>

        </div>

        <!-- نموذج تسجيل الخروج الفعلي: تم ربطه بسكربت ذكي يحول العميل إلى index.html بعد قطع الاتصال -->
        <form action="$(link-logout)" name="logout" id="actual-logout-form">
            <!-- تمت إزالة وسم التوجيه الافتراضي وتعديل السلوك عبر الجافاسكربت بالأسفل -->
            <button type="submit" class="logout-btn">إنهاء الاتصال</button>
        </form>
    </div>

    <script>
        // اعتراض نموذج إنهاء الاتصال لضمان الخروج الفعلي والتحويل المباشر لـ index.html
        document.getElementById('actual-logout-form').addEventListener('submit', function(e) {
            e.preventDefault(); // إيقاف التوجيه التلقائي الإجباري للمايكروتك
            
            var logoutUrl = this.getAttribute('action');
            
            // إرسال طلب تسجيل الخروج الفعلي للسيرفر عبر الخلفية لقطع الاتصال فوراً
            fetch(logoutUrl, { method: "POST" })
            .then(function() {
                // بعد قطع الاتصال بنجاح، نتوجه فوراً لصفحة تسجيل الدخول index.html والكوكيز آمنة
                window.location.href = "index.html";
            })
            .catch(function() {
                // احتياطاً في حال حدوث أي مشكلة في الاستجابة
                window.location.href = "index.html";
            });
        });

        // حماية وإخفاء نصف اسم المستخدم
        (function maskUsername() {
            var rawUser = "$(username)";
            if (!rawUser || rawUser.startsWith("$")) {
                document.getElementById("masked-user").innerText = "مستخدم نشط";
                return;
            }
            var len = rawUser.length;
            if (len <= 3) {
                document.getElementById("masked-user").innerText = rawUser + "*".repeat(len - 1);
            } else {
                var visibleLen = Math.ceil(len / 2);
                var maskedPart = "*".repeat(len - visibleLen);
                document.getElementById("masked-user").innerText = rawUser.substring(0, visibleLen) + maskedPart;
            }
        })();

        // حساب التحميل المتبقي
        var totalBytes = parseInt("$(limit-bytes-total)") || 0;
        var bytesIn = parseInt("$(bytes-in)") || 0;
        var bytesOut = parseInt("$(bytes-out)") || 0;
        var usedBytes = bytesIn + bytesOut;

        function formatBytes(bytes) {
            if (bytes <= 0) return "غير محدود";
            var sizes = ['بايت', 'كيلوبايت', 'ميجابايت', 'جيجابايت', 'تيرابايت'];
            var i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + sizes[i];
        }

        if (totalBytes > 0) {
            var remainBytes = totalBytes - usedBytes;
            if (remainBytes < 0) remainBytes = 0;
            document.getElementById("remain-bytes").innerText = formatBytes(remainBytes);
        } else {
            document.getElementById("remain-bytes").innerText = "باقة غير محدودة";
        }
// اعتراض نموذج تغيير السرعة لمنع التوجيه لروابط خارجية مثل r.com
document.getElementById('speed-change-form').addEventListener('submit', function(e) {
    e.preventDefault(); // منع المتصفح من الانتقال للرابط الخارجي
    
    var logoutUrl = "$(link-logout)"; // رابط المايكروتك لإنهاء الاتصال بالسرعة القديمة
    var speedValue = document.getElementById('speed-select').value;
    
    // تجهيز البيانات لإرسالها في الخلفية
    var formData = new FormData();
    formData.append('erase-cookie', 'true');
    formData.append('dst', speedValue);

    // إرسال طلب تغيير السرعة للسيرفر في الخلفية دون مغادرة الصفحة
    fetch(logoutUrl, {
        method: "POST",
        body: formData
    })
    .then(function() {
        // بعد نجاح العملية، نتوجه لصفحة تسجيل الدخول ليعاد ربطه تلقائياً بالسرعة الجديدة
        window.location.href = "login.html"; 
    })
    .catch(function() {
        // احتياطاً في حال حدوث أي خطأ في الشبكة أثناء قطع الاتصال
        window.location.href = "login.html";
    });
});

    </script>
</body>
</html>
