<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم تسجيل الدخول بنجاح</title>
   

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }
        .icon-box svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #f8fafc;
            font-weight: 700;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(59, 130, 246, 0.4);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>

    <!-- سكربت المايكروتك للتوجيه التلقائي -->
    <script>
        function startRedirect() {
            setTimeout(function() {
                var redirectUrl = "$(link-redirect)";
                if (redirectUrl && redirectUrl !== "" && redirectUrl !== "undefined") {
                    window.location.href = redirectUrl;
                } else {
                    window.location.href = "http://172.17.15.1";
                }
            }, 2000); // سيتم التوجيه تلقائياً بعد 3 ثوانٍ
        }
    </script>
</head>
<body onload="startRedirect()">

    <div class="card">
        <!-- أيقونة النجاح -->
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h1>أهلاً بك، تم الاتصال!</h1>
        <p>تم تسجيل دخولك بنجاح إلى الشبكة والاستمتاع بإنترنت سريع ومستقر. جاري توجيهك الآن...</p>

        <!-- زر الانتقال الفوري في حال عدم التوجيه التلقائي -->
        <a href="$(link-redirect)" class="btn">تصفح الإنترنت الآن</a>

        <div class="footer">
            شبكتنا ترحب بك دائماً
        </div>
    </div>

</body>
</html>
