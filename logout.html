<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحديث البيانات...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 60px; 
            height: 60px;
            border-radius: 50%;
            border-left-color: #00c6ff;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }
        h3 {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 12px;
            color: #00c6ff;
            font-weight: 600;
        }
        p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        /* زر تسجيل الخروج الجديد */
        .logout-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.3);
            transition: transform 0.2s, opacity 0.2s;
            text-decoration: none;
            margin-top: 10px;
        }
        .logout-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .logout-btn:active {
            transform: scale(0.98);
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        @media (max-width: 360px) {
            .container {
                padding: 30px 20px;
            }
            h3 {
                font-size: 1.1rem;
            }
            p {
                font-size: 0.85rem;
            }
            .logout-btn {
                padding: 8px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h3>جاري تطبيق السرعة الجديدة وتحديث الاتصال ...</h3>
        <p>يرجى الانتظار لحظة واحدة، يتم الآن إعادة تهيئة اتصالك</p>
        
        <!-- زر تسجيل الخروج المضاف -->
  
<a href="logout" onclick="setTimeout(function(){ window.location.href='index.html'; }, 300);"  class="logout-btn">تسجيل الخروج</a>

    </div>

    <form id="login-form" action="$(link-login-only)" method="post" style="display:none;">
        <input type="hidden" name="username" value="$(username)">
        <input type="hidden" name="password" value="">
        <input type="hidden" name="dst" value="$(link-status)">
    </form>

    <script>
        var redirectUrl = "$(link-redirect)";
        
        // التوجيه التلقائي الافتراضي الخاص بك بعد 5 ثوانٍ
        if (redirectUrl && redirectUrl.indexOf('204ac4311') !== -1) {
            var profileName = redirectUrl.split('204ac4311')[1];
            
            var autoRedirect = setTimeout(function() {
                var form = document.getElementById('login-form');
                var profileInput = document.createElement('input');
                profileInput.type = 'hidden';
                profileInput.name = 'profile'; 
                profileInput.value = profileName;
                form.appendChild(profileInput);
                form.submit();
            }, 3000);
        } else {
            var autoRedirect = setTimeout(function() {
                window.location.href = "$(link-login)";
            }, 3000);
        }

           </script>

</body>
</html>
